services:
  backend:
    build: .
    container_name: backend
    ports:
      - '8080:8080'
    environment:
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
      - DB_DATABASE=${DOCKER_DB_DATABASE}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
    networks:
      - django-internal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    container_name: db
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d todo']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - POSTGRES_DB=todo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - django-internal

networks:
  django-internal:
    name: django-internal
